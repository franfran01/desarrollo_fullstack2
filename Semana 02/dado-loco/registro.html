<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro | Dado Loco</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="encabezado navbar navbar-expand-lg sticky-top" data-bs-theme="dark">
    <a href="index.html" class="logo">
      <span class="logo-dado">🎲</span>
      <span class="logo-texto">Dado Loco</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu-principal" aria-controls="menu-principal" aria-expanded="false" aria-label="Abrir menú">
      <span class="navbar-toggler-icon"></span>
    </button>
    <nav class="collapse navbar-collapse" id="menu-principal">
      <ul class="navbar-nav ms-auto menu">
        <li class="nav-item"><a href="index.html" class="nav-link">Inicio</a></li>
        <li class="nav-item"><a href="estrategia.html" class="nav-link">Estrategia</a></li>
        <li class="nav-item"><a href="familiares.html" class="nav-link">Familiares</a></li>
        <li class="nav-item"><a href="cartas.html" class="nav-link">Cartas</a></li>
        <li class="nav-item"><a href="cooperativos.html" class="nav-link">Cooperativos</a></li>
        <li class="nav-item"><a href="registro.html" class="nav-link activo" aria-current="page">Registro</a></li>
      </ul>
    </nav>
  </header>

  <main class="container py-4">
    <section class="cabecera-categoria">
      <h1>Registro</h1>
      <p>Crea tu cuenta para ganar recompensas por tus compras en Dado Loco.</p>
    </section>

    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-8">
        <!-- novalidate: los mensajes los muestra js/registro.js -->
        <form id="form-registro" class="formulario" novalidate>
          <div class="row g-3">
            <div class="col-12">
              <label for="nombre" class="form-label">Nombre completo</label>
              <input type="text" class="form-control" id="nombre" name="nombre" autocomplete="name" required aria-describedby="error-nombre">
              <div class="invalid-feedback" id="error-nombre"></div>
            </div>
            <div class="col-12 col-md-6">
              <label for="usuario" class="form-label">Nombre de usuario</label>
              <input type="text" class="form-control" id="usuario" name="usuario" autocomplete="username" required aria-describedby="error-usuario">
              <div class="invalid-feedback" id="error-usuario"></div>
            </div>
            <div class="col-12 col-md-6">
              <label for="correo" class="form-label">Correo electrónico</label>
              <input type="email" class="form-control" id="correo" name="correo" autocomplete="email" required aria-describedby="error-correo">
              <div class="invalid-feedback" id="error-correo"></div>
            </div>
            <div class="col-12 col-md-6">
              <label for="clave" class="form-label">Contraseña</label>
              <input type="password" class="form-control" id="clave" name="clave" autocomplete="new-password" required aria-describedby="ayuda-clave error-clave">
              <div class="form-text" id="ayuda-clave">De 6 a 18 caracteres, con al menos un número y una mayúscula.</div>
              <div class="invalid-feedback" id="error-clave"></div>
            </div>
            <div class="col-12 col-md-6">
              <label for="repetir" class="form-label">Repetir contraseña</label>
              <input type="password" class="form-control" id="repetir" name="repetir" autocomplete="new-password" required aria-describedby="error-repetir">
              <div class="invalid-feedback" id="error-repetir"></div>
            </div>
            <div class="col-12 col-md-6">
              <label for="fecha" class="form-label">Fecha de nacimiento</label>
              <input type="date" class="form-control" id="fecha" name="fecha" autocomplete="bday" required aria-describedby="error-fecha">
              <div class="invalid-feedback" id="error-fecha"></div>
            </div>
            <div class="col-12 col-md-6">
              <label for="direccion" class="form-label">Dirección de despacho (opcional)</label>
              <input type="text" class="form-control" id="direccion" name="direccion" autocomplete="street-address">
            </div>
          </div>

          <div class="d-flex flex-column flex-sm-row justify-content-end gap-3 mt-4">
            <button type="reset" class="boton boton-inicio">Limpiar</button>
            <button type="submit" class="boton">Enviar</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="pie">
    <p>&copy; 2026 Dado Loco &middot; Tienda de juegos de mesa</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/validaciones.js"></script>
  <script src="js/registro.js"></script>
</body>
</html>
