<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña | Dado Loco</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="encabezado navbar navbar-expand-lg sticky-top" data-bs-theme="dark">
    <a href="index.html" class="logo">
      <span class="logo-dado">🎲</span>
      <span class="logo-texto">Dado Loco</span>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu-principal" aria-controls="menu-principal" aria-expanded="false" aria-label="Abrir menú">
      <span class="navbar-toggler-icon"></span>
    </button>
    <nav class="collapse navbar-collapse" id="menu-principal">
      <ul class="navbar-nav ms-auto menu">
        <li class="nav-item"><a href="index.html" class="nav-link">Inicio</a></li>
        <li class="nav-item"><a href="catalogo.html" class="nav-link">Catálogo</a></li>
        <li class="nav-item dropdown">
          <a href="#" class="nav-link dropdown-toggle" role="button" data-bs-toggle="dropdown" aria-expanded="false">Categorías</a>
          <ul class="dropdown-menu">
            <li><a href="estrategia.html" class="dropdown-item">Estrategia</a></li>
            <li><a href="familiares.html" class="dropdown-item">Familiares</a></li>
            <li><a href="cartas.html" class="dropdown-item">Cartas</a></li>
            <li><a href="cooperativos.html" class="dropdown-item">Cooperativos</a></li>
          </ul>
        </li>
      </ul>
    </nav>
  </header>

  <main class="container py-4">
    <section class="cabecera-categoria">
      <h1>Recuperar contraseña</h1>
      <p>Escribe el correo de tu cuenta y te enviaremos un enlace para crear una contraseña nueva.</p>
    </section>

    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5">
        <!-- novalidate: los mensajes los muestra js/formulario.js -->
        <form id="form-recuperar" class="formulario" novalidate>
          <div class="mb-3">
            <label for="correo" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="correo" name="correo" autocomplete="email" required aria-describedby="error-correo">
            <div class="invalid-feedback" id="error-correo"></div>
          </div>
          <button type="submit" class="boton w-100">Enviar enlace</button>
          <p class="mt-3 mb-0 small"><a href="login.html">Volver a iniciar sesión</a></p>
        </form>
      </div>
    </div>
  </main>

  <footer class="pie">
    <p>&copy; 2026 Dado Loco &middot; Tienda de juegos de mesa</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/sesion.js"></script>
  <script src="js/validaciones.js"></script>
  <script src="js/formulario.js"></script>
  <script src="js/recuperar.js"></script>
</body>
</html>
