<main class="container py-4">
  <section class="cabecera-categoria">
    <h1>Catálogo</h1>
    <p>Todos nuestros juegos de mesa en un solo lugar.</p>
  </section>

  <form class="row g-3 mb-4 justify-content-center" role="search" [formGroup]="filtros">
    <div class="col-12 col-sm-6 col-lg-4">
      <label for="filtro-texto" class="form-label">Buscar por nombre</label>
      <input type="search" class="form-control" id="filtro-texto" formControlName="texto" placeholder="Ej: Catan">
    </div>
    <div class="col-12 col-sm-6 col-lg-3">
      <label for="filtro-categoria" class="form-label">Categoría</label>
      <select class="form-select" id="filtro-categoria" formControlName="categoria">
        <option value="">Todas</option>
        <option *ngFor="let c of categorias" [value]="c.id">{{ c.nombre }}</option>
      </select>
    </div>
  </form>

  <section class="grilla row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4" aria-live="polite">
    <app-ficha-producto *ngFor="let p of productosFiltrados" [producto]="p" [puedeComprar]="sesion.puedeComprar" />
    <p class="col-12 text-center" *ngIf="!productosFiltrados.length">No encontramos juegos con esa búsqueda.</p>
  </section>
</main>
