<main class="container py-4">
  <section class="cabecera-categoria">
    <h1>Recuperar contraseña</h1>
    <p>Escribe el correo de tu cuenta y te enviaremos un enlace para crear una contraseña nueva.</p>
  </section>

  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-7 col-lg-5">
      <form class="formulario" [formGroup]="formulario" (ngSubmit)="enviar()" novalidate>
        <div class="mb-3">
          <label for="correo" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="correo" formControlName="correo" autocomplete="email"
                 [class.is-invalid]="error" aria-describedby="error-correo">
          <div class="invalid-feedback" id="error-correo">{{ error }}</div>
        </div>
        <button type="submit" class="boton w-100">Enviar enlace</button>
        <p class="mt-3 mb-0 small"><a routerLink="/login">Volver a iniciar sesión</a></p>
      </form>
      <div class="alert alert-success mt-3" role="alert" *ngIf="mensaje">{{ mensaje }}</div>
    </div>
  </div>
</main>
